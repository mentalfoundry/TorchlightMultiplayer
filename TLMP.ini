; Torchlight Multiplayer settings. Command-line flags override these:
;   Torchlight.exe -tlmp-host [port]
;   Torchlight.exe -tlmp-join <address>[:port] -tlmp-name <name>

[net]
; off | host | client
mode=off
address=127.0.0.1
port=27960
; host: open the port on the router with UPnP (1) or not (0)
upnp=1

[player]
name=Adventurer

[party]
; Host only (everyone plays by the host's settings).
; Monster health added for each player in the game beyond the first: 0.5 = +50% per extra player
; (2 players: x1.5, 4 players: x2.5). 0 turns it off.
monster_health_per_player=0.5
; Monster damage added for each player beyond the first: 0.0625 = +6.25% per extra player (as in
; Diablo 2). 0 turns it off.
monster_damage_per_player=0.0625
; Experience from kills:
;   diablo2 = a kill's XP grows like monster health (x1.5 for 2 players, x2.5 for 4), +35% when more
;             than one player is near it, and is split between the players near it by level
;   full    = everyone near a kill gets all of its XP
experience=diablo2
; diablo2 only: players far from the monster's level get less of their share (100% within 5 levels,
; down to 5% at 10 levels or more, as in Diablo 2). 0 turns it off.
experience_level_gap=1
; Loot bonus for playing together: for each other player near a kill, monsters drop "nothing" less
; often (0.25: an ordinary monster's 8% drop chance becomes 9.9% with 2 players near, 11.8% with 3,
; 13.6% with 4; champions' and bosses' sure drops are unchanged). 0 turns it off.
loot_bonus_per_player=0.25
